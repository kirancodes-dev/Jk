version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jharkhand_sih_web
    restart: unless-stopped
    ports:
      - "8008:8008"
    environment:
      - DATABASE_URL=postgresql://sih_user:sih_secure_password_2026@db:5432/sih_jharkhand
      - SECRET_KEY=jharkhand-sih-2026-production-super-secret-key-64chars-minimum
      - DEMO_MODE=false
      - ENVIRONMENT=production
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: jharkhand_sih_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_secure_password_2026
      POSTGRES_DB: sih_jharkhand
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sih_user -d sih_jharkhand"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads_data:
