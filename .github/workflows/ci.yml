name: CI/CD Pipeline - SIH26043 Jharkhand Innovation Portal

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  traceability-check:
    name: Requirements Traceability Matrix Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify TRACEABILITY_MATRIX.md citations resolve to real files/tests
        run: python scripts/verify_traceability.py

  backend-tests:
    name: Backend Test Suite & Security Validation
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sih_user
          POSTGRES_PASSWORD: sih_password
          POSTGRES_DB: sih_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python Dependencies & Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx flake8 bandit pip-audit

      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics

      - name: Security SAST Scan with Bandit
        run: |
          # Scan backend application code for common security vulnerabilities
          bandit -r backend/app -ll -x backend/app/tests --format custom --msg-template "{abspath}:{line}: {severity}: {test_id}: {msg}" || true

      - name: Dependency Vulnerability Audit with pip-audit
        run: |
          # Verify zero known CVEs in third-party python packages
          pip-audit -r backend/requirements.txt || true

      - name: Run Alembic Migrations against PostgreSQL
        env:
          DATABASE_URL: postgresql://sih_user:sih_password@localhost:5432/sih_portal
          ENVIRONMENT: test
          SECRET_KEY: ci-secure-test-secret-key-at-least-32-chars-long
        run: |
          alembic upgrade head

      - name: Run Backend Pytest Suite (PostgreSQL)
        env:
          DATABASE_URL: postgresql://sih_user:sih_password@localhost:5432/sih_portal
          ENVIRONMENT: test
          SECRET_KEY: ci-secure-test-secret-key-at-least-32-chars-long
          DEMO_MODE: "true"
        run: |
          PYTHONPATH=. pytest tests/ -v


  frontend-tests:
    name: Frontend Lint & Widget Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Run Flutter Analyzer
        run: |
          cd frontend
          flutter analyze --no-fatal-infos

      - name: Run Flutter Widget Tests
        run: |
          cd frontend
          flutter test --no-pub

  frontend-web-build:
    name: Flutter Web Release Build
    runs-on: ubuntu-latest
    needs: frontend-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter Dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Flutter Web Release Bundle
        run: |
          cd frontend
          flutter build web --release

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-web-build
          path: frontend/build/web
          retention-days: 14
